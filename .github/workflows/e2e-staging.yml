# Gerbang E2E — CI-D07 (cicd-pipeline.md), ADR-149, S-002.
# PR staging → main: tunggu Railway selesai deploy commit staging terbaru,
# lalu jalankan Playwright (Chrome) terhadap staging. Hijau = required check
# untuk PR staging → main. Deploy tetap dilakukan Railway (CI-D04), bukan
# workflow ini.
#
# Pemicu (T-175.1, direvisi 2026-10-29): `pull_request` ke `main`, bukan
# `push` ke `staging`. Percobaan pertama memakai `push`, tetapi Railway
# ("Wait for CI") menahan deploy sampai semua workflow di push itu selesai,
# sedangkan workflow ini menunggu deploy: saling tunggu (deploy tertahan
# `WAITING`). Event PR tidak ditunggu Railway, dan check-nya menempel di SHA
# ujung `staging` (= head PR), tepat yang dibaca required check.
# `deployment_status` tidak dipakai karena hanya berjalan bila berkasnya sudah
# ada di branch default (main). `workflow_dispatch` tersedia untuk run manual.
# Tunggu deploy: polling status deployment GitHub dari Railway (environment
# "Postific / staging") untuk SHA ujung staging.
#
# Secrets (GitHub → Settings → Secrets): E2E_USER_EMAIL, E2E_USER_PASSWORD.
# Opsional (Variables): E2E_BASE_URL (default URL staging di bawah).

name: E2E staging

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  e2e:
    name: E2E staging
    # Hanya PR promosi staging → main (PR hotfix dari branch lain tidak punya
    # deployment staging untuk ditunggu).
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://web-staging-60d7.up.railway.app' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      SKIP_ENV_VALIDATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tunggu deploy Railway untuk commit ini
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Pada PR, github.sha adalah merge commit; yang di-deploy Railway = head PR.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/wait-railway-deploy.sh

      - name: Install Chrome
        working-directory: apps/web
        run: bunx playwright install --with-deps chrome

      - name: E2E (Playwright, Chrome)
        run: bun run test:e2e

      - name: Unggah laporan dan trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
